# Mandatory checks are assigned exactly once in validation-partitions.json.
# A missing, failed, cancelled or mismatched receipt keeps the required gate red.
name: validation
on:
  push:
    branches: [main, 'ci/*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  quality:
    name: validation / quality
    runs-on: [self-hosted, linux, x64, runspindle-isolated, strix]
    timeout-minutes: 15
    outputs:
      receipt: ${{ steps.partition.outputs.receipt }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - id: partition
        name: Run quality partition
        run: python3 tools/partition_validation.py quality --output "$GITHUB_OUTPUT"
  component:
    name: validation / component
    runs-on: [self-hosted, linux, x64, runspindle-isolated, strix]
    timeout-minutes: 15
    outputs:
      receipt: ${{ steps.partition.outputs.receipt }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - id: partition
        name: Run component partition
        run: python3 tools/partition_validation.py component --output "$GITHUB_OUTPUT"
  rust:
    name: validation / rust
    runs-on: [self-hosted, linux, x64, runspindle-isolated, strix]
    timeout-minutes: 15
    outputs:
      receipt: ${{ steps.partition.outputs.receipt }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - id: partition
        name: Run rust partition
        run: python3 tools/partition_validation.py rust --output "$GITHUB_OUTPUT"
  mutation:
    name: validation / mutation
    runs-on: [self-hosted, linux, x64, runspindle-isolated, strix]
    timeout-minutes: 15
    outputs:
      receipt: ${{ steps.partition.outputs.receipt }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - id: partition
        name: Run mutation partition
        run: python3 tools/partition_validation.py mutation --output "$GITHUB_OUTPUT"
  strix-linux-x64:
    name: validation / strix-linux-x64
    if: ${{ always() }}
    needs: [quality, component, rust, mutation]
    runs-on: [self-hosted, linux, x64, runspindle-isolated, strix]
    timeout-minutes: 5
    env:
      RECEIPT_QUALITY: ${{ needs.quality.outputs.receipt }}
      RESULT_QUALITY: ${{ needs.quality.result }}
      RECEIPT_COMPONENT: ${{ needs.component.outputs.receipt }}
      RESULT_COMPONENT: ${{ needs.component.result }}
      RECEIPT_RUST: ${{ needs.rust.outputs.receipt }}
      RESULT_RUST: ${{ needs.rust.result }}
      RECEIPT_MUTATION: ${{ needs.mutation.outputs.receipt }}
      RESULT_MUTATION: ${{ needs.mutation.result }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify exact partition coverage and image binding
        run: python3 tools/partition_validation.py aggregate
