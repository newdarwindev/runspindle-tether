# Mandatory checks are assigned exactly once in validation-partitions.json.
# Missing, failed, cancelled or mismatched receipts keep the required gate red.
# Five empty partitions are attested in this aggregate guest; any new work
# in those partitions fails closed until the workflow is updated.
name: validation
on:
  push:
    branches: [main, 'ci/*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  quality:
    name: validation / quality
    runs-on: [self-hosted, linux, x64, runspindle-isolated, strix]
    timeout-minutes: 15
    outputs:
      receipt: ${{ steps.partition.outputs.receipt }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - id: partition
        name: Run quality partition
        run: python3 tools/partition_validation.py quality --output "$GITHUB_OUTPUT"
  component:
    name: validation / component
    runs-on: [self-hosted, linux, x64, runspindle-isolated, strix]
    timeout-minutes: 15
    outputs:
      receipt: ${{ steps.partition.outputs.receipt }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Checkout pinned v1 compatibility source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: newdarwindev/runspindle-tether
          ref: 040b71f2213a34f34e6b6a40124ed1164b93ce30
          path: .feedback-v1
          persist-credentials: false
      - name: Checkout original Tether source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: larsderidder/tether
          ref: 0a5e8fc89390d383d4f5b4dfb827c5ea3128ad0a
          path: .upstream-tether
          persist-credentials: false
      - name: Checkout original agent-tether source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: larsderidder/agent-tether
          ref: 1256d1a260abb10fdf16a9b842b942b2ccac1310
          path: .upstream-agent-tether
          persist-credentials: false
      - id: partition
        name: Run component partition
        env:
          RUNSPINDLE_TETHER_V1_SOURCE: ${{ github.workspace }}/.feedback-v1
        run: python3 tools/partition_validation.py component --output "$GITHUB_OUTPUT"
  strix-linux-x64:
    name: validation / strix-linux-x64
    if: ${{ always() }}
    needs: [quality, component]
    runs-on: [self-hosted, linux, x64, runspindle-isolated, strix]
    timeout-minutes: 5
    env:
      RECEIPT_QUALITY: ${{ needs.quality.outputs.receipt }}
      RESULT_QUALITY: ${{ needs.quality.result }}
      RECEIPT_COMPONENT: ${{ needs.component.outputs.receipt }}
      RESULT_COMPONENT: ${{ needs.component.result }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify exact partition coverage and image binding
        run: python3 tools/partition_validation.py aggregate-empty
